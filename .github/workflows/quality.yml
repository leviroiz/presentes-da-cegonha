name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Security checks
        run: |
          php scripts/security_check.php
          php tests/security_smoke.php
