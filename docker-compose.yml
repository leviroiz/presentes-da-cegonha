services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: development
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?Defina DB_NAME no arquivo .env}
      DB_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      SESSION_SECURE: "false"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Defina DB_NAME no arquivo .env}
      MARIADB_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo .env}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./bd_cegonha.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
